name: iPhone app

# Compiles the iPhone app (ios/) for the simulator, without signing, so a broken build shows up here
# and not first in Xcode on the Mac. Signing and installing happen on the owner's Mac (docs/de/iphone-app.md).
# macOS minutes count ten times against GitHub's free quota of a private repository (Dominik 2026-11-04:
# "ich möchte nichts bei github bezahlen"), so this never runs on a push: once a night, and only when
# something under ios/ (or this file) changed on main in the last 25 hours; the check runs cheaply on Linux.
# By hand (Actions → iPhone app → Run workflow) it always builds, also on a branch.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"   # 03:17 (winter) / 04:17 (summer) Berlin time

permissions:
  contents: read

concurrency:
  group: iphone-app
  cancel-in-progress: true

jobs:
  # decides on Linux whether the Mac is needed at all
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changed.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 300
      - id: changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "started by hand: build"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n=$(git log --since="25 hours ago" --format=%H -- ios .github/workflows/ios.yml | wc -l)
          echo "iOS commits in the last 25 hours: $n"
          if [ "$n" -gt 0 ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build for the simulator
        working-directory: ios
        run: |
          # the whole log is long: on failure show every error line, else the end
          xcodebuild -project Spark.xcodeproj -scheme Spark -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:|\*\* BUILD" build.log | sort -u | head -80; exit 1; }
          tail -n 30 build.log
