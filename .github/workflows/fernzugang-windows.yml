name: Fernzugang Windows

# The Fernzugang on a real Windows (stage 5): tools/fernzugang_windows.py runs the panel's file
# spark-anker-einrichten.cmd as Administrator (OpenSSH Server, Python only for the anchor from python.org with its
# pinned SHA-256, the user spark, two tasks), opens a real SSH session through the anchor (PowerShell, SFTP) and
# removes everything again through the panel's „abbauen“. A stand-in panel on 127.0.0.1; no secret is used.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/anker/**
      - app/panel/fernwindows.py
      - tools/fernzugang_windows.py
      - .github/workflows/fernzugang-windows.yml

permissions:
  contents: read

concurrency:
  group: fernzugang-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Stand-in panel needs
        run: python -m pip install -q cryptography==50.0.2 paramiko==5.0.0
      # the usual PC: OpenSSH Server there (the runner has it) but not running: the anchor switches it on for itself
      - name: sshd off, then set up, use and remove the anchor for real
        run: |
          Stop-Service sshd -ErrorAction SilentlyContinue
          Set-Service sshd -StartupType Manual -ErrorAction SilentlyContinue
          python tools/fernzugang_windows.py
      # sshd already in use: only the anchor's own block, and sshd runs on afterwards as it was
      - name: sshd running, then the same again
        run: |
          Start-Service sshd
          python tools/fernzugang_windows.py
