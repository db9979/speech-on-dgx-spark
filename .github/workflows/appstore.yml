name: App Store texts

# Writes the store texts from ios/fastlane/metadata (name, subtitle, description, keywords, URLs,
# categories, de + en) into App Store Connect. Only by hand (Actions → App Store texts → Run workflow),
# never on push. Uploads no build, no screenshots and never submits for review.
# Needs three repository secrets from an App Store Connect API key (role "App Manager"):
# ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY (the whole .p8 file). Guide: docs/de/iphone-veroeffentlichen.md.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle-ID der App (wie APP_BUNDLE_ID in Xcode)"
        required: true
      version:
        description: "App-Version in App Store Connect"
        required: true
        default: "1.0"
      copyright:
        description: "Copyright, z. B. 2026 Vorname Nachname"
        required: true

permissions:
  contents: read

jobs:
  texts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: fastlane
        run: gem install fastlane -v 2.238.0 --no-document
      - name: Upload texts
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_VERSION: ${{ inputs.version }}
          COPYRIGHT: ${{ inputs.copyright }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY" ]; then
            echo "::error::Secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY are missing (see docs/de/iphone-veroeffentlichen.md)"
            exit 1
          fi
          key="$RUNNER_TEMP/asc.json"
          trap 'rm -f "$key"' EXIT
          python3 -c 'import json,os; print(json.dumps({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"], "key": os.environ["ASC_KEY"], "in_house": False}))' > "$key"
          fastlane deliver --platform ios --api_key_path "$key" \
            --app_identifier "$BUNDLE_ID" --app_version "$APP_VERSION" --copyright "$COPYRIGHT" \
            --metadata_path ios/fastlane/metadata \
            --skip_binary_upload true --skip_screenshots true \
            --submit_for_review false --run_precheck_before_submit false --force true
