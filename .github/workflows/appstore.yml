name: App Store texts

# Writes the store texts from ios/fastlane/metadata (name, subtitle, description, keywords, URLs,
# categories, de + en) and, if wanted, the pictures from the branch app-store-screenshots (workflow
# "App Store screenshots") into App Store Connect. Only by hand (Actions → App Store texts → Run workflow),
# never on push. Uploads no build and never submits for review.
# Needs three repository secrets from an App Store Connect API key (role "App Manager"):
# ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY (the whole .p8 file). Guide: docs/de/iphone-veroeffentlichen.md.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle-ID der App (wie APP_BUNDLE_ID in Xcode)"
        required: true
      version:
        description: "App-Version in App Store Connect"
        required: true
        default: "1.0"
      copyright:
        description: "Copyright, z. B. 2026 Vorname Nachname"
        required: true
      screenshots:
        description: "Bildschirmfotos mit hochladen (ersetzt die vorhandenen)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  texts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Pictures
        if: inputs.screenshots
        run: |
          git fetch -q --depth 1 origin app-store-screenshots
          git checkout FETCH_HEAD -- ios/fastlane/screenshots
          ls -R ios/fastlane/screenshots
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: fastlane
        run: gem install fastlane -v 2.240.1 --no-document
      - name: Upload texts
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_VERSION: ${{ inputs.version }}
          COPYRIGHT: ${{ inputs.copyright }}
          SHOTS: ${{ inputs.screenshots }}
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY" ]; then
            echo "::error::Secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY are missing (see docs/de/iphone-veroeffentlichen.md)"
            exit 1
          fi
          key="$RUNNER_TEMP/asc.json"
          trap 'rm -f "$key"' EXIT
          python3 -I ci/asc_key.py json "$key"
          if [ "$SHOTS" = "true" ]; then pics=(--screenshots_path ./fastlane/screenshots --overwrite_screenshots true); else pics=(--skip_screenshots true); fi
          # settings in ios/fastlane/Deliverfile (without it deliver asks a question and stops)
          fastlane deliver --api_key_path "$key" \
            --app_identifier "$BUNDLE_ID" --app_version "$APP_VERSION" --copyright "$COPYRIGHT" "${pics[@]}"
