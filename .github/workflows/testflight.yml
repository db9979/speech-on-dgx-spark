name: TestFlight

# Builds the iPhone app in release mode, lets Apple sign it (Xcode's automatic signing with the
# App Store Connect API key, no certificate files) and uploads it to TestFlight. Only by hand
# (Actions → TestFlight → Run workflow) and only for a commit whose "Tests" run passed, like update.sh.
# The build number is the commit count (build phase "Build number"), so every upload is higher.
# Needs repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY (the whole .p8 of an App Store Connect
# team key with role Admin, needed for signing) and ASC_TEAM_ID (Apple Developer → Membership → Team ID).
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle-ID der App (wie APP_BUNDLE_ID in Xcode)"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the build number counts all commits
      - name: Only a tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total_count", 0))')
          if [ "$ok" = "0" ]; then
            echo "::error::The Tests run of $GITHUB_SHA has not passed (yet). Wait for it, then start again."
            exit 1
          fi
      - name: Xcode
        run: |
          # Apple only takes uploads built with a current SDK: the newest Xcode on the runner
          x=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$x"
          xcodebuild -version
      - name: Signing key and keychain
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY ASC_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing (see docs/de/iphone-veroeffentlichen.md)"; exit 1; fi
          done
          case "$ASC_KEY_ID$ASC_TEAM_ID" in *[!A-Z0-9]*) echo "::error::Key ID or Team ID has odd characters"; exit 1;; esac
          umask 077
          python3 -I ios/ci/asc_key.py pem "$RUNNER_TEMP/AuthKey.p8"
          # a keychain of its own for the certificate Xcode fetches; deleted at the end
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$kc"
      - name: Archive
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          case "$BUNDLE_ID" in *[!A-Za-z0-9.-]*|"") echo "::error::Bundle-ID looks wrong"; exit 1;; esac
          xcodebuild -project Spark.xcodeproj -scheme Spark -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Spark.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" APP_BUNDLE_ID="$BUNDLE_ID" CODE_SIGN_STYLE=Automatic \
            archive > archive.log 2>&1 \
            || { grep -E "error:|\*\* ARCHIVE" archive.log | sort -u | head -60; exit 1; }
          tail -n 5 archive.log
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleVersion" "$RUNNER_TEMP/Spark.xcarchive/Info.plist"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${ASC_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Spark.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 \
            || { grep -iE "error|fail" export.log | sort -u | head -60; exit 1; }
          tail -n 10 export.log
          echo "Uploaded. The build shows in App Store Connect → TestFlight after 5 to 30 minutes."
      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
