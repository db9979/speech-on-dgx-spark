name: TestFlight

# Builds the iPhone app in release mode, lets Apple sign it (Xcode's automatic signing with the
# App Store Connect API key, no certificate files) and uploads it to TestFlight. By hand
# (Actions → TestFlight → Run workflow) and by itself after a commit on main that changed ios/: once
# "iPhone app" and "Tests" passed for it, at most one upload per hour; a newer iOS commit in the
# waiting time replaces the older one. Off with the repository variable TESTFLIGHT_AUTO=off.
# Only for a commit whose "Tests" run passed, like update.sh. If a newer push cancelled that run, the
# newest main commit with passed Tests goes up instead, but only when it contains the iOS commit.
# The build number is the commit count (build phase "Build number"), so every upload is higher.
# Needs repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY (the whole .p8 of an App Store Connect
# team key with role Admin, needed for signing) and ASC_TEAM_ID (Apple Developer → Membership → Team ID).
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle-ID der App (wie APP_BUNDLE_ID in Xcode)"
        required: true
        default: "io.github.db9979.speechspark"
  workflow_run:
    workflows: ["iPhone app"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  # decides whether and which commit goes up; waits cheaply on Linux, not on the Mac
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    concurrency:
      group: testflight-gate
      cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && vars.TESTFLIGHT_AUTO != 'off')
    outputs:
      go: ${{ steps.check.outputs.go }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO: ${{ github.event_name == 'workflow_run' }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions"
          get() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/$1"; }
          # the Tests run of this commit: by hand it must have passed already, automatically wait for it.
          # Many commits land on main close together and a newer push cancels the older Tests run. A
          # cancelled run is no verdict: then the newest main commit with passed Tests goes up, but only
          # if it contains this commit (so it carries the same iOS change). Failed Tests still stop.
          for i in $(seq 1 60); do
            st=$(get "workflows/tests.yml/runs?head_sha=$SHA&per_page=1" | python3 -c '
          import json, sys
          r = json.load(sys.stdin).get("workflow_runs") or []
          print(r[0]["status"] + ":" + str(r[0]["conclusion"]) if r else "none")')
            [ "$st" = "completed:success" ] && break
            if [ "$st" = "completed:cancelled" ]; then
              newer=$(get "workflows/tests.yml/runs?branch=main&event=push&status=success&per_page=1" | python3 -c '
          import json, sys
          r = json.load(sys.stdin).get("workflow_runs") or []
          print(r[0]["head_sha"] if r else "")')
              case "$newer" in *[!0-9a-f]*|"") newer="";; esac
              rel=""
              if [ -n "$newer" ]; then
                rel=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$SHA...$newer" \
                  | python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))')
              fi
              if [ "$rel" = "ahead" ]; then
                echo "Tests of $SHA were cancelled by a newer push; taking $newer, which contains it and passed"
                SHA=$newer; st="completed:success"; break
              fi
              [ "$AUTO" = "true" ] && { sleep 30; continue; }
            fi
            if [ "$AUTO" != "true" ] || [ "${st%%:*}" = "completed" ]; then
              echo "::error::The Tests run of $SHA has not passed ($st). Wait for it, then start again."
              exit 1
            fi
            sleep 30
          done
          [ "$st" = "completed:success" ] || { echo "::error::Tests did not finish in time"; exit 1; }
          if [ "$AUTO" = "true" ]; then
            # at most one automatic upload per hour: wait for the rest of the hour after the last good upload
            left=$(get "workflows/testflight.yml/runs?status=success&per_page=1" | python3 -c '
          import datetime, json, sys
          r = json.load(sys.stdin).get("workflow_runs") or []
          if not r:
              print(0)
          else:
              t = datetime.datetime.fromisoformat(r[0]["created_at"].replace("Z", "+00:00"))
              now = datetime.datetime.now(datetime.timezone.utc)
              print(max(0, int(3600 - (now - t).total_seconds())))')
            if [ "$left" -gt 0 ]; then echo "Last upload less than an hour ago, waiting $left s"; sleep "$left"; fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  upload:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || vars.APP_BUNDLE_ID || 'io.github.db9979.speechspark' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0          # the build number counts all commits
      - name: Xcode
        run: |
          # Apple only takes uploads built with a current SDK: the newest Xcode on the runner
          x=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$x"
          xcodebuild -version
      - name: Signing key and keychain
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY ASC_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing (see docs/de/iphone-veroeffentlichen.md)"; exit 1; fi
          done
          case "$ASC_KEY_ID$ASC_TEAM_ID" in *[!A-Z0-9]*) echo "::error::Key ID or Team ID has odd characters"; exit 1;; esac
          umask 077
          python3 -I ios/ci/asc_key.py pem "$RUNNER_TEMP/AuthKey.p8"
          # a keychain of its own for the certificate Xcode fetches; deleted at the end
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$kc"
      - name: Archive
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          case "$BUNDLE_ID" in *[!A-Za-z0-9.-]*|"") echo "::error::Bundle-ID looks wrong"; exit 1;; esac
          xcodebuild -project Spark.xcodeproj -scheme Spark -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Spark.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" APP_BUNDLE_ID="$BUNDLE_ID" CODE_SIGN_STYLE=Automatic \
            archive > archive.log 2>&1 \
            || { grep -E "error:|\*\* ARCHIVE" archive.log | sort -u | head -60; exit 1; }
          tail -n 5 archive.log
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleVersion" "$RUNNER_TEMP/Spark.xcarchive/Info.plist"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${ASC_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          # first a signed .ipa here, then the upload on its own: Apple's upload service sometimes times out,
          # so each part gets up to three tries
          for try in 1 2 3; do
            rm -rf "$RUNNER_TEMP/export"
            if xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Spark.xcarchive" \
                -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
                -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1; then
              break
            fi
            grep -iE "error|fail" export.log | sort -u | head -30
            [ "$try" = 3 ] && exit 1
            echo "Export try $try failed, again in 60 s"; sleep 60
          done
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          ls -l "$ipa"
          # altool finds the key as AuthKey_<ID>.p8 in API_PRIVATE_KEYS_DIR
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          cp "$RUNNER_TEMP/AuthKey.p8" "$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          for try in 1 2 3; do
            if xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > upload.log 2>&1; then
              tail -n 5 upload.log
              echo "Uploaded. The build shows in App Store Connect → TestFlight after 5 to 30 minutes."
              exit 0
            fi
            grep -iE "error|fail|timed out" upload.log | sort -u | head -30
            [ "$try" = 3 ] && exit 1
            echo "Upload try $try failed, again in 60 s"; sleep 60
          done
      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
