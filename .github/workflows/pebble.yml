name: Pebble watch app

# Builds the watch app "Spark" (pebble/) with the Pebble SDK, keeps it as the artifact speech-spark-pbw and puts
# it on the branch pebble-build (only that file, replaced each time). The panel serves app/pebble/speech-spark.pbw
# from main: copy the built file there in a normal commit (pebble/README.md), so the Tests run and tars' update gate
# see it. The app declares SDK minor 0x5e (the speaker API), so older watch firmware runs it too.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pebble/**
      - .github/workflows/pebble.yml

permissions:
  contents: read

concurrency:
  group: pebble-app
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write   # only for the branch pebble-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Pebble SDK
        run: |
          set -e
          uv tool install pebble-tool
          yes | pebble sdk install latest
          # keep the app runnable on watch firmware with SDK minor 0x5e (see pebble/README.md)
          n=0
          for h in $(find "$HOME" -name pebble_process_info.h -path '*sdk*' 2>/dev/null); do
            grep -n 'PROCESS_INFO_CURRENT_SDK_VERSION_MINOR' "$h" | head -2
            sed -i -E 's/(#define[[:space:]]+PROCESS_INFO_CURRENT_SDK_VERSION_MINOR[[:space:]]+)0x[0-9a-fA-F]+/\10x5e/' "$h"
            grep -Eq 'PROCESS_INFO_CURRENT_SDK_VERSION_MINOR[[:space:]]+0x5e' "$h"
            n=$((n+1))
          done
          echo "patched $n headers"
          test "$n" -gt 0
      - name: Build
        working-directory: pebble
        run: |
          set -e
          pebble build
          ver=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          python3 - "$ver" <<'PY'
          import json, sys, zipfile
          z = zipfile.ZipFile("build/pebble.pbw")
          label = json.loads(z.read("appinfo.json"))["versionLabel"]
          js = z.read("pebble-js-app.js").decode()
          assert label == sys.argv[1], (label, sys.argv[1])
          for p in ("emery", "flint", "gabbro"):
              head = z.read(p + "/pebble-app.bin")[:12]
              assert head[:6] == b"PBLAPP" and head[10:12] == bytes([5, 0x5e]), (p, list(head[8:12]))
          assert f"var APP_VERSION = '{label}';" in js, "APP_VERSION in src/pkjs/index.js differs from package.json"
          print("built", label)
          PY
          cp build/pebble.pbw speech-spark.pbw
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speech-spark-pbw
          path: pebble/speech-spark.pbw
          if-no-files-found: error
      - name: Branch pebble-build
        run: |
          set -e
          mkdir out && cp pebble/speech-spark.pbw out/
          cd out
          git init -q -b pebble-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add speech-spark.pbw
          git commit -q -m "speech-spark.pbw from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" pebble-build
