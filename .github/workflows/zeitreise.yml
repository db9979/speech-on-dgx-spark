name: Zeitreise

# The self-tests once more with the clock 120 days ahead, every night (code review 2026-11-11, Dominik „1-11“).
# A test with a fixed moment in it turns red by itself once the real day has moved far enough: on 2026-11-11 main
# went red without any push (moments of 12.10. met a 30-day window), and the Spark installs only versions whose
# "Tests" run is green. tools/zeitreise.py runs every test module under libfaketime and names the tests that are
# red there but green with today's date; this workflow opens the issue "Zeitreise rot" with them (a comment for
# every further red night, closed by the next green one). Nothing here changes or skips a test of "Tests", and
# this run decides nothing about updates. By hand: Actions → "Zeitreise" → Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: zeitreise
  cancel-in-progress: false

jobs:
  zeitreise:
    name: Uhr 120 Tage voraus
    runs-on: ubuntu-24.04   # as "Tests"
    timeout-minutes: 180   # 75 min measured: a module libfaketime holds up waits twice for its limit
    permissions:
      contents: read
      issues: write         # only for the issue "Zeitreise rot"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-panel.lock
      - name: Install
        run: |
          # the panel's packages as "Tests" installs them; no browser (the page tests need the real clock)
          python -m pip install -q --no-deps --require-hashes -r app/requirements-panel.lock
          printf '%s\n' 'DPkg::Lock::Timeout "300";' 'Acquire::Retries "5";' 'Acquire::http::Timeout "60";' 'Acquire::https::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/99ci >/dev/null
          sudo apt-get install -y -q --no-install-recommends faketime ffmpeg
      - name: Clock ahead
        id: lauf
        env:
          ZEITREISE_NOTE: ${{ runner.temp }}/zeitreise.md
        run: python tools/zeitreise.py
      # names of tests only, no output
      - name: Note on GitHub
        continue-on-error: true
        if: always() && github.ref == 'refs/heads/main' && (steps.lauf.outcome == 'success' || steps.lauf.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.lauf.outcome }}
          NOTE: ${{ runner.temp }}/zeitreise.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          R="$GITHUB_REPOSITORY"
          head="Lauf: $RUN (Commit ${GITHUB_SHA:0:7})"
          red=$(gh issue list -R "$R" --state open --search 'in:title "Zeitreise rot"' --json number,title \
                  --jq 'map(select(.title == "Zeitreise rot")) | .[0].number // empty')
          if [ "$OUTCOME" = "success" ]; then
            [ -z "$red" ] || gh issue close "$red" -R "$R" -c "Wieder grün. $head"
          else
            { echo "$head"; echo; cat "$NOTE" 2>/dev/null || echo "Der Lauf lieferte kein Ergebnis."; } > body.md
            if [ -n "$red" ]; then gh issue comment "$red" -R "$R" -F body.md
            else gh issue create -R "$R" -t "Zeitreise rot" -F body.md; fi
          fi
