name: Android app

# Builds the Android app "Spark" (android/, a thin shell around the Spark's page) and, when the signing key is
# set up, publishes it as release android-v<version> with spark.apk and android.json (version, code, size,
# SHA-256). The Spark fetches the newest android-v… release, checks the SHA-256 and offers it to its profiles
# (app/panel/android.py). No store.
#
# Signing key (once, see docs/de/android-app.md): repository secrets ANDROID_KEYSTORE (the .jks file as
# base64) and ANDROID_KEYSTORE_PASSWORD. Without them the build only checks that the app compiles.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Android SDK 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/spark.jks"
            echo "SPARK_KEYSTORE=$RUNNER_TEMP/spark.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No signing key (secret ANDROID_KEYSTORE): the app is built but not published."
          fi
      - name: Build
        env:
          SPARK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish android-v<version>
        if: env.SPARK_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          name=$(sed -n 's/^name=//p' android/version.properties)
          code=$(sed -n 's/^code=//p' android/version.properties)
          mkdir release
          cp android/app/build/outputs/apk/release/app-release.apk release/spark.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/spark.apk | head -3
          sha=$(sha256sum release/spark.apk | cut -d' ' -f1)
          size=$(stat -c %s release/spark.apk)
          printf '{"version": "%s", "code": %s, "size": %s, "sha256": "%s"}\n' "$name" "$code" "$size" "$sha" > release/android.json
          echo "$sha  spark.apk" > release/spark.apk.sha256
          cat release/android.json
          rm -f "$RUNNER_TEMP/spark.jks"
          if gh release view "android-v$name" > /dev/null 2>&1; then
            echo "::notice::android-v$name exists already: raise name and code in android/version.properties for a new release."
          else
            gh release create "android-v$name" release/* --title "Android-App $name" \
              --notes "Die App „Spark“ fürs Android-Handy (Hülle um die Spark-Seite). Wird vom Spark selbst geholt und über Ich → Android-App angeboten. SHA-256: $sha" --latest=false
          fi
