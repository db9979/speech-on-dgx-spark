name: Spark-Begleiter Windows

# Builds the Windows companion "Spark-Begleiter" (tools/begleiter/windows, .NET 8 WinForms tray app) as
# self-contained single .exe files for x64 and ARM64 and publishes them in the release "begleiter-windows"
# (created on the first run, files replaced on later runs). The exe files are not signed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/begleiter/windows/**
      - tools/begleiter/outlook-classic/**
      - .github/workflows/begleiter-windows.yml

permissions:
  contents: read

concurrency:
  group: begleiter-windows
  cancel-in-progress: true

jobs:
  build:
    environment: release   # releases and the update signing key only from main
    permissions:
      contents: write   # only for the release upload
    runs-on: windows-latest
    env:
      HAS_UPDKEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build x64 and ARM64
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          # first the Outlook classic add-in (.NET Framework 4.8 COM DLL); the companion embeds it
          dotnet build tools/begleiter/outlook-classic/SparkOutlook.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path tools/begleiter/outlook-classic/bin/Release/net48/SparkOutlook.dll)) { Write-Error 'SparkOutlook.dll missing'; exit 1 }
          $project = 'tools/begleiter/windows/SparkBegleiter.csproj'
          # version from app/VERSION ("V01.0.342" -> "1.0.342"), the same number the Spark compares for updates
          $raw = (Get-Content app/VERSION -Raw).Trim().TrimStart('V')
          $version = ($raw.Split('.') | ForEach-Object { [int]$_ }) -join '.'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $files = [ordered]@{}
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish $project -c Release -r "win-$arch" --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:Version=$version -o "publish/$arch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $name = "SparkBegleiter-$arch.exe"
            Copy-Item "publish/$arch/SparkBegleiter.exe" "dist/$name"
            $files[$arch] = [ordered]@{ name = $name; size = (Get-Item "dist/$name").Length;
                                        sha256 = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLower() }
          }
          # begleiter.json: what the Spark checks before it hands an update to a paired PC (begleiter.py)
          [ordered]@{ version = $version; files = $files } | ConvertTo-Json -Depth 4 | Set-Content dist/begleiter.json -Encoding utf8NoBOM
          Get-Content dist/begleiter.json
          Get-ChildItem dist | Format-Table Name, Length

      # OPTIONAL: begleiter.json.sig (Ed25519, app/panel/signatur.py); skipped until the secret exists.
      # Git for Windows brings OpenSSL 3.
      - name: OPTIONAL sign begleiter.json
        if: env.HAS_UPDKEY == 'true'
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        # (the checkout may have turned the script's line ends into CRLF)
        run: tr -d '\r' < tools/sign-manifest.sh | bash -s -- dist/begleiter.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SparkBegleiter-windows
          path: |
            dist/*.exe
            dist/begleiter.json
            dist/begleiter.json.sig
          if-no-files-found: error

      - name: Publish release begleiter-windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'begleiter-windows'
          $files = @('dist/SparkBegleiter-x64.exe', 'dist/SparkBegleiter-arm64.exe', 'dist/begleiter.json')
          if (Test-Path dist/begleiter.json.sig) { $files += 'dist/begleiter.json.sig' }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            $notes = @(
              'Spark-Begleiter für Windows: kleines Programm im Infobereich für den eigenen Spark – Schreibhilfe (Strg+Alt+S), Frag Spark (Strg+Alt+A), Diktieren (Strg+Alt+D), Meldungen, Zustandspunkt und Mein-Notaus-Knopf.',
              '',
              '- SparkBegleiter-x64.exe: die meisten PCs (Intel/AMD)',
              '- SparkBegleiter-arm64.exe: Windows auf ARM',
              '',
              'Nicht signiert: SmartScreen beim ersten Start mit „Weitere Informationen“ → „Trotzdem ausführen“ bestätigen.',
              'Koppeln im Panel unter Ich → Begleiter → „Gerät koppeln“. Anleitung: tools/begleiter/windows/README.md'
            ) -join "`n"
            gh release create $tag @files --title 'Spark-Begleiter für Windows' --notes $notes --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
