name: Tests

# Runs the panel's self-tests on every push to main, including the browser test (tests/test_ui_browser.py:
# every page on a computer and a phone screen, settings search, Ich window). Everything runs against fake
# services from tests/helpers.py; nothing here talks to a real Spark.
on:
  workflow_dispatch:
  # every push, not only app/**: update.sh installs only commits whose run here passed, so a change
  # to install.sh or update.sh needs its own green run too
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # a run that started finishes (only the newest waiting push is kept): with pushes every few minutes
  # cancelling it meant no run ever passed, and update.sh installs only versions whose run passed
  cancel-in-progress: false

jobs:
  # four parts at the same time (V01.0.502): one run took 15-45 min in a single job. selftest.py cuts the test
  # modules by their duration in app/tests/dauer.json; together the parts hold every test exactly once
  test:
    name: Teil ${{ matrix.part }}
    runs-on: ubuntu-24.04   # pinned (V01.1.219): ubuntu-latest moved to 26.04, where Playwright installs no Chromium
    timeout-minutes: 60   # 45 was cut off by a slow Azure mirror on the 94 MB ffmpeg download (V01.0.951, 2026-10-23); 30 twice on 2026-10-12 (V01.0.459, .461), 20 before
    strategy:
      fail-fast: false    # every part runs to its end, so a red run shows all failures at once
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-panel.lock
      - name: Install
        run: |
          # the panel's packages exactly as install.sh builds them: versions and hashes from the lock (V01.0.286)
          python -m pip install -q --no-deps --require-hashes -r app/requirements-panel.lock
          python -m pip install -q playwright==1.55.0
          # ffmpeg from apt pulled 99 packages / 94 MB, most of it Recommends (pocketsphinx, the mesa/vdpau/va
          # driver stack, sdl2, jack, pulse, flite ...), and the Azure ubuntu mirror sometimes delivered that so
          # slowly the job hit its time cap (V01.0.950-.953 rot, every time on the ffmpeg step). Two changes make
          # it robust. (1) --no-install-recommends drops those extras: ffmpeg's codec libraries are hard Depends
          # and still come, so every codec the tests use is present, which cuts the download substantially.
          # (2) apt itself is made resilient - it waits for the dpkg lock (unattended-upgrades holds it at job
          # start, else "Could not get lock ... code: 100", V01.0.950/.951), and aborts only a *stalled*
          # connection (60 s, then retries it) while a slow but progressing download runs on (V01.0.952). With
          # the 60-min job cap that leaves, even a slow mirror finishes. No test is touched or weakened.
          printf '%s\n' 'DPkg::Lock::Timeout "300";' 'Acquire::Retries "5";' 'Acquire::http::Timeout "60";' 'Acquire::https::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/99ci >/dev/null
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          # Fernzugang → Bildschirm (test_fernbild): a real guacd with its VNC part, x11vnc and Xvfb for the end-to-end test
          sudo apt-get install -y -q --no-install-recommends guacd libguac-client-vnc0 x11vnc xvfb
          sudo systemctl disable --now guacd.service 2>/dev/null || true
      - name: Self-tests
        working-directory: app
        # a failed test gets one second try (selftest.py); green only then is a warning in the summary
        env:
          SELFTEST_REPORT: ${{ runner.temp }}/teil.json
        run: python selftest.py discover -s tests --part ${{ matrix.part }}/4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: teil-${{ matrix.part }}
          path: ${{ runner.temp }}/teil.json
          retention-days: 3
          if-no-files-found: ignore

  # the parts together: every part reported, and "more than 5 failures is red" counts over the whole run
  ergebnis:
    name: Ergebnis
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # only for the issues "main rot" and "Wackelnde Tests" (V01.0.820): nobody noticed main red for 10 h over night
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: app/selftest.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/teile
          pattern: teil-*
      - name: All parts
        id: alle
        env:
          PARTS: ${{ needs.test.result }}
          SELFTEST_DAUER: ${{ runner.temp }}/dauer.json
          SELFTEST_NOTE: ${{ runner.temp }}/note.md
        run: |
          python3 app/selftest.py --sum "$RUNNER_TEMP/teile" 4
          [ "$PARTS" = "success" ] || { echo "::error::A part of the self-tests is red ($PARTS)"; exit 1; }
      # main red: one open issue "main rot" with the red tests (GitHub tells the repository's owner), a comment on it
      # for every further red run, closed by the next green one; tests green only the second time are counted as
      # comments on "Wackelnde Tests". A cancelled run says nothing. Names of tests only, no output.
      - name: Note on GitHub
        continue-on-error: true   # a refused issue never turns a green run red
        if: always() && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.alle.outcome }}
          NOTE: ${{ runner.temp }}/note.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          R="$GITHUB_REPOSITORY"
          open_issue() { gh issue list -R "$R" --state open --search "in:title \"$1\"" --json number,title \
                           --jq "map(select(.title == \"$1\")) | .[0].number // empty"; }
          head="Lauf: $RUN (Commit ${GITHUB_SHA:0:7})"
          red=$(open_issue "main rot")
          if [ "$OUTCOME" = "success" ]; then
            [ -z "$red" ] || gh issue close "$red" -R "$R" -c "Wieder grün. $head"
          else
            { echo "$head"; echo; cat "$NOTE" 2>/dev/null || echo "Ein Teil lieferte kein Ergebnis."; } > body.md
            if [ -n "$red" ]; then gh issue comment "$red" -R "$R" -F body.md
            else gh issue create -R "$R" -t "main rot" -F body.md; fi
          fi
          if [ "$OUTCOME" = "success" ] && grep -q "zweiten Versuch" "$NOTE" 2>/dev/null; then
            { echo "$head"; echo; cat "$NOTE"; } > wackel.md
            w=$(open_issue "Wackelnde Tests")
            if [ -n "$w" ]; then gh issue comment "$w" -R "$R" -F wackel.md
            else gh issue create -R "$R" -t "Wackelnde Tests" -F wackel.md; fi
          fi
      # the durations measured here, for app/tests/dauer.json when one part gets much longer than the others
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dauer
          path: ${{ runner.temp }}/dauer.json
          retention-days: 7
          if-no-files-found: ignore
