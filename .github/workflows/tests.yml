name: Tests

# Runs the panel's self-tests on every push to main, including the browser test (tests/test_ui_browser.py:
# every page on a computer and a phone screen, settings search, Ich window). Everything runs against fake
# services from tests/helpers.py; nothing here talks to a real Spark.
on:
  workflow_dispatch:
  # every push, not only app/**: update.sh installs only commits whose run here passed, so a change
  # to install.sh or update.sh needs its own green run too
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -q fastapi "uvicorn[standard]" python-multipart httpx psutil num2words numpy pypdf \
            icalendar recurring-ical-events cryptography segno "pillow==11.3.0" "pypdfium2==4.30.0" "rmscene==0.8.0" playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q ffmpeg
      - name: Self-tests
        working-directory: app
        run: python -m unittest discover -s tests
