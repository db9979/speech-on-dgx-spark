# Türsteher vor dem MCP-Server: nur /mcp, nur mit dem Schlüssel. SCHLUESSEL ersetzen (openssl rand -hex 32).
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    location = /mcp {
        if ($http_authorization != "Bearer SCHLUESSEL") { return 401; }
        proxy_pass http://mcp:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
