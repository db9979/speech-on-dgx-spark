<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark-Konsole</title>
<link rel="icon" href="/static/favicon-32.png">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/konsole.css">
<link rel="stylesheet" href="/static/modellgenau.css">
<script src="/static/js/icons.js" defer></script>
<script src="/static/js/sparkverbinden.js" defer></script>
<script src="/static/js/zeichnen.js" defer></script>
<script src="/static/js/konsole.js" defer></script>
<script src="/static/js/modellgenau.js" defer></script>
</head>
<body>
<!-- Spark-Konsole neu (Dominik 2026-11-18 „1-6“): a side bar with four areas on a computer, the same four as a bar at
     the bottom of a phone; Modelle and Verbindungen as list and detail. Light and dark follow the system. -->
<div class="kapp">
<aside class="kside" id="kside" hidden>
  <div class="kbrand"><span class="klogo" aria-hidden="true">S</span><div><b id="kname">Spark</b><small id="khost"></small></div></div>
  <nav class="knav" id="ktabs">
    <a href="#ueberblick" data-tab="ueberblick"><i data-ic="home"></i><span>Überblick</span></a>
    <a href="#modelle" data-tab="modelle"><i data-ic="cpu"></i><span>Modelle</span></a>
    <a href="#verbindungen" data-tab="verbindungen"><i data-ic="link"></i><span>Verbindungen</span></a>
    <a href="#wartung" data-tab="wartung"><i data-ic="wrench"></i><span>Wartung</span><em class="kdotb" id="kwdot" hidden></em></a>
  </nav>
  <div class="kfoot"><div id="kstate"></div><div id="kupd"></div><button class="klink" type="button" id="kout">Abmelden</button></div>
</aside>
<main id="kmain">
  <section id="klogin" class="kcard klogin" hidden>
    <h1 id="klt">Anmelden</h1>
    <p class="k" id="kld">Die Konsole dieses Spark. Nur im Heimnetz, mit dem Passwort aus der Installation.</p>
    <form id="klform">
      <input type="password" id="klpw" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort">
      <input type="text" id="klcode" inputmode="numeric" autocomplete="one-time-code" placeholder="Code aus der App" aria-label="Code" hidden>
      <button class="btn" type="submit" id="klgo">Anmelden</button>
      <p class="k" id="klmsg" role="status"></p>
    </form>
  </section>
  <section id="tab-ueberblick" class="tab" hidden></section>
  <!-- Modell genau (modellgenau.js, the same page as Zustand → Modell-Rechner genau in the panel): a detail of Überblick -->
  <section id="tab-modellgenau" class="tab" hidden>
    <a class="kback" href="#ueberblick" data-tab="ueberblick" id="kmgback">‹ Überblick</a>
    <div id="zmgdet" hidden>
      <h1 id="kmgt">Modell genau</h1>
      <div class="k mgmeta" id="zmgmeta"></div>
      <div id="zmgbody"></div>
    </div>
  </section>
  <section id="tab-modelle" class="tab" hidden></section>
  <section id="tab-verbindungen" class="tab" hidden></section>
  <section id="tab-wartung" class="tab" hidden></section>
</main>
</div>
<div id="kcode" class="modal" hidden>
  <div class="kcard">
    <h2 id="kct">Code bestätigen</h2>
    <p class="k" id="kcd">Diese Änderung braucht einen frischen Code aus der Authenticator-App.</p>
    <input type="text" id="kcin" inputmode="numeric" autocomplete="one-time-code" aria-label="Code">
    <div class="row"><button class="btn" type="button" id="kcok">Bestätigen</button><button class="btn sec" type="button" id="kcno">Abbrechen</button></div>
  </div>
</div>
</body>
</html>
